<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<title>Wrap Throughput Timer</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#14171A; --surface:#1E2226; --surface-2:#262B30; --surface-3:#2F353B;
    --text:#ECEDEE; --text-dim:#9BA3AB; --text-faint:#6B7278;
    --accent:#E8A33D; --danger:#D9534F; --machine:#5B8DB8; --success:#4CA771;
    --border:#33393F; --radius:6px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:72px;
  }
  .nums{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
  header.app{
    position:sticky; top:0; z-index:20;
    background:var(--bg); border-bottom:1px solid var(--border);
    padding:14px 16px 10px;
  }
  header.app h1{font-size:17px; margin:0 0 2px; font-weight:700; letter-spacing:-0.01em;}
  header.app p{margin:0; font-size:12.5px; color:var(--text-dim);}
  nav.tabs{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    display:flex; background:var(--surface); border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--text-faint);
    font-size:11.5px; padding:10px 4px 8px; display:flex; flex-direction:column;
    align-items:center; gap:3px; font-family:inherit;
  }
  nav.tabs button .dot{width:6px;height:6px;border-radius:50%;background:transparent;}
  nav.tabs button.active{color:var(--accent);}
  nav.tabs button.active .dot{background:var(--accent);}
  main{padding:10px 8px 12px; max-width:900px; margin:0 auto;}
  #panelsContainer{display:flex; gap:6px; align-items:flex-start;}
  #panelsContainer .panel{flex:1; min-width:0; padding:9px;}
  #panelsContainer .timer-big{font-size:22px;}
  #panelsContainer .timer-mid{font-size:15px; font-weight:700;}
  #panelsContainer .panel-head .label{font-size:9px;}
  #panelsContainer .panel-head .wname{font-size:16px;}
  #panelsContainer .hint{font-size:9.5px;}
  /* Bigger, easier-to-hit timing buttons — doubled height, fills the dead space */
  #panelsContainer .btn{font-size:14.5px; padding:18px 6px;}
  #panelsContainer .btn.small{font-size:11.5px; padding:10px 5px;}
  .btnstack{display:flex; flex-direction:column; gap:8px; margin-top:10px;}
  .quickrow{display:flex; gap:5px; margin-top:8px;}
  .quickrow .btn{flex:1;}
  .btn.err-active{background:var(--danger); color:#fff; border-color:var(--danger); animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.7;}}
  .btn.single-active{background:var(--machine); color:#fff; border-color:var(--machine);}
  .btn.exc-active{background:var(--accent); color:#1A1300; border-color:var(--accent); animation:pulse 1.4s infinite;}
  .view{display:none;}
  .view.active{display:block;}
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px; margin-bottom:12px;
  }
  .card h2{font-size:13.5px; margin:0 0 10px; color:var(--text-dim); font-weight:600;}
  .card h3{font-size:14px; margin:0 0 8px; font-weight:600;}
  .row{display:flex; gap:8px; align-items:center;}
  .row.between{justify-content:space-between;}
  label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:4px;}
  input[type=text],input[type=number],select,textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:10px 10px; border-radius:4px; font-size:14.5px; font-family:inherit;
  }
  textarea{resize:vertical; min-height:60px;}
  .field{margin-bottom:10px;}
  button{cursor:pointer; font-family:inherit;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--surface-3); color:var(--text); border:1px solid var(--border);
    padding:11px 14px; border-radius:4px; font-size:14px; font-weight:600;
  }
  .btn:active{transform:scale(0.98);}
  .btn.primary{background:var(--accent); color:#1A1300; border-color:var(--accent);}
  .btn.danger{background:var(--danger); color:#fff; border-color:var(--danger);}
  .btn.success{background:var(--success); color:#0C1F14; border-color:var(--success);}
  .btn.ghost{background:transparent;}
  .btn.block{width:100%;}
  .btn.small{padding:7px 10px; font-size:12.5px;}
  .btn:disabled{opacity:0.4;}
  .badge{
    display:inline-block; font-size:11px; padding:2px 7px; border-radius:20px;
    background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);
  }
  .badge.running{background:rgba(232,163,61,.15); color:var(--accent); border-color:var(--accent);}
  .panel{
    border-left:3px solid var(--border); background:var(--surface); border-radius:var(--radius);
    border-top:1px solid var(--border); border-right:1px solid var(--border); border-bottom:1px solid var(--border);
    padding:14px; margin-bottom:14px;
  }
  .panel.state-idle{border-left-color:var(--border);}
  .panel.state-cycle{border-left-color:var(--accent);}
  .panel.state-fault{border-left-color:var(--danger);}
  .panel-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .panel-head .label{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); font-weight:700;}
  .timer-big{font-size:38px; font-weight:700; line-height:1; margin:6px 0;}
  .timer-sub{font-size:12.5px; color:var(--text-dim); margin-bottom:2px;}
  .stack{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 4px; border-bottom:1px solid var(--border); font-size:14px;
  }
  .list-item:last-child{border-bottom:none;}
  .list-item small{display:block; color:var(--text-dim); font-size:11.5px; margin-top:2px;}
  .empty{color:var(--text-faint); font-size:13px; padding:10px 2px;}
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:100;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background:var(--surface); border-radius:14px 14px 0 0; width:100%; max-width:640px;
    padding:16px 16px calc(16px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  }
  .sheet h3{margin:0 0 12px;}
  .close-x{background:none;border:none;color:var(--text-dim);font-size:20px;line-height:1;padding:4px 8px;}
  .modal-actions{display:flex; gap:8px; margin-top:14px;}
  .modal-actions .btn{flex:1;}
  .chip-select{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    padding:8px 12px; border-radius:20px; border:1px solid var(--border); background:var(--surface-2);
    font-size:13px; color:var(--text-dim);
  }
  .chip.selected{background:var(--accent); color:#1A1300; border-color:var(--accent); font-weight:600;}
  .settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .hint{font-size:11.5px; color:var(--text-faint); margin-top:3px;}
  hr.sep{border:none; border-top:1px solid var(--border); margin:12px 0;}
  .toast{
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    background:var(--surface-3); color:var(--text); padding:10px 16px; border-radius:20px;
    font-size:13px; z-index:200; border:1px solid var(--border); opacity:0; transition:opacity .2s;
    pointer-events:none;
  }
  .toast.show{opacity:1;}
  .mic-btn{
    width:44px; height:44px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text-dim); display:flex; align-items:center; justify-content:center;
    font-size:18px; flex-shrink:0;
  }
  .mic-btn.recording{background:var(--danger); color:#fff; border-color:var(--danger);}
</style>
</head>
<body>

<header class="app">
  <h1>Wrap Throughput Timer</h1>
  <p id="headerSub">Cycle · wrap · fault tracking for pallet wrappers</p>
</header>

<main>
  <!-- TIMER VIEW -->
  <div class="view active" id="view-timer">
    <div class="row between" style="margin-bottom:10px;">
      <div class="badge" id="dateBadge"></div>
    </div>
    <div id="panelsContainer"></div>
  </div>

  <!-- SETUP VIEW -->
  <div class="view" id="view-setup">
    <div class="card">
      <h2>Wrappers</h2>
      <div id="wrappersList" class="stack"></div>
      <button class="btn primary block" id="addWrapperBtn" style="margin-top:10px;">+ Add wrapper</button>
    </div>
    <div class="card">
      <h2>Reset</h2>
      <button class="btn ghost block" id="loadDefaultsBtn">Load example (SW0038, SW0039 — high speed)</button>
      <button class="btn ghost block" id="wipeBtn" style="margin-top:8px;">Erase all data</button>
    </div>
  </div>

  <!-- HISTORY / EXPORT VIEW -->
  <div class="view" id="view-history">
    <div class="card">
      <h2>Sessions logged</h2>
      <div id="sessionsList" class="stack"></div>
      <p class="empty" id="sessionsEmpty" style="display:none;">No completed sessions yet.</p>
    </div>
    <div class="card">
      <h2>Export</h2>
      <p class="hint" style="margin-bottom:10px;">One row per error (or one row per cycle if none). Ready for a dashboard to ingest.</p>
      <button class="btn primary block" id="exportCsvBtn">Export CSV</button>
      <button class="btn block" id="shareCsvBtn" style="margin-top:8px; display:none;">Share / Email CSV</button>
    </div>
  </div>
</main>

<nav class="tabs">
  <button data-view="timer" class="active"><span class="dot"></span>Timer</button>
  <button data-view="setup"><span class="dot"></span>Setup</button>
  <button data-view="history"><span class="dot"></span>History / Export</button>
</nav>

<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------------
   STATE — flat: wrappers + sessions + panels.
   v3: bumped storage key because the data shape changed (per-position
   settings for high speed, wrap-attempt list instead of single wrapStart,
   simplified error types, exception timer). Old v2 data will NOT carry
   over — that's expected, not a bug.
--------------------------------------------------------------- */
const STORE_KEY = 'wrapTimerState_v3';
const ERROR_TYPES = ['Missed pallet','Film pulled from clamps','Wrap broke','Safety-Lidar false hold','Tuning/adjustment issue','Other'];
const EXCEPTION_TYPES = ['Film reload','Case fell off pallet','Operator handling delay'];
const SETTINGS_FIELDS = [
  ['carriageUp','Carriage up'], ['carriageDown','Carriage down'], ['rotation','Rotation speed'],
  ['filmTension','Film tension'], ['topWraps','Top wraps'], ['bottomWraps','Bottom wraps'], ['autoHeight','Auto height timer']
];

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }

function defaultState(){
  return {
    wrappers: [],
    sessions: [],
    panels: { A: null, B: null },
  };
}
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error('load failed', e); }
  return defaultState();
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

function defaultSettingsFields(){
  const out = {};
  SETTINGS_FIELDS.forEach(([key])=>{ out[key] = ''; });
  return out;
}
function mkWrapper(number, speedClass){
  return {
    id: uid('wr'), number, speedClass,
    settings: speedClass === 'high'
      ? { front: defaultSettingsFields(), back: defaultSettingsFields() }
      : defaultSettingsFields()
  };
}
function loadDefaults(){
  state.wrappers.push(mkWrapper('SW0038','high'), mkWrapper('SW0039','high'));
  save(); renderAll(); showToast('Example wrappers added');
}
function getWrapper(id){ return state.wrappers.find(w=>w.id===id); }

/* ---------------------------------------------------------------
   HELPERS
--------------------------------------------------------------- */
function fmtDur(ms){
  if(ms==null || ms<0) ms=0;
  const s = Math.floor(ms/1000);
  const h = Math.floor(s/3600);
  const m = Math.floor((s%3600)/60);
  const sec = s%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${m}:${String(sec).padStart(2,'0')}`;
}
function nowIso(){ return new Date().toISOString(); }
function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

/* Derived wrap-attempt helpers — Start Wrap Cycle can be tapped
   repeatedly; every tap before the final one is an auto-logged
   false start, no manual button needed. */
function currentWrapStart(cycle){
  // Wrap timer starts on the FIRST attempt and runs continuously — it
  // does not reset on repeat taps. Repeat taps only add to the false
  // start count/lost time below.
  return cycle.wrapAttempts.length ? cycle.wrapAttempts[0] : null;
}
function failedStartCount(cycle){
  return Math.max(0, cycle.wrapAttempts.length - 1);
}
function failedStartsTotalMs(cycle){
  let total = 0;
  for(let i=0;i<cycle.wrapAttempts.length-1;i++){
    total += cycle.wrapAttempts[i+1] - cycle.wrapAttempts[i];
  }
  return total;
}

/* ---------------------------------------------------------------
   TAB NAV — always refresh the tab you're switching TO
--------------------------------------------------------------- */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
    if(btn.dataset.view==='history') renderHistory();
    if(btn.dataset.view==='setup') renderSetup();
    if(btn.dataset.view==='timer') renderPanels();
  });
});

/* ---------------------------------------------------------------
   SETUP VIEW
--------------------------------------------------------------- */
function renderSetup(){
  const wrList = document.getElementById('wrappersList');
  wrList.innerHTML = '';
  if(state.wrappers.length===0){ wrList.innerHTML = '<p class="empty">No wrappers yet. Add one below.</p>'; }
  state.wrappers.forEach(w=>{
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `<span>${w.number} <span class="badge">${w.speedClass==='high'?'High speed':'Low speed'}</span></span>`;
    const del = document.createElement('button');
    del.className='btn small ghost'; del.textContent='Remove';
    del.onclick=()=>{
      state.wrappers = state.wrappers.filter(x=>x.id!==w.id);
      save(); renderSetup();
    };
    div.appendChild(del);
    wrList.appendChild(div);
  });
}

document.getElementById('addWrapperBtn').onclick = ()=>{
  openSheet('Add wrapper', `
    <div class="field"><label>Speed class</label>
      <div class="chip-select" id="m_wrSpeed">
        <div class="chip selected" data-val="high">High speed</div>
        <div class="chip" data-val="low">Low speed</div>
      </div>
    </div>
    <div class="field"><label>Wrapper number</label><input type="text" id="m_wrNum" placeholder="e.g. SW0038"></div>
  `, ()=>{
    const number = document.getElementById('m_wrNum').value.trim();
    if(!number) return showToast('Enter a wrapper number');
    const speedClass = document.querySelector('#m_wrSpeed .chip.selected').dataset.val;
    state.wrappers.push(mkWrapper(number, speedClass));
    save(); renderSetup(); closeSheet();
    showToast(`${number} added`);
  });
  wireChipGroups(['m_wrSpeed']);
};

document.getElementById('loadDefaultsBtn').onclick = loadDefaults;
document.getElementById('wipeBtn').onclick = ()=>{
  openConfirm('Erase all data?','This clears every wrapper, session, and log. This cannot be undone.', ()=>{
    state = defaultState(); save(); renderAll();
  });
};

/* ---------------------------------------------------------------
   MODAL / SHEET UTILITIES
--------------------------------------------------------------- */
function openSheet(title, bodyHtml, onSave, saveLabel){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="sheet">
        <div class="row between"><h3>${title}</h3><button class="close-x" id="ovClose">&times;</button></div>
        <div id="ovBody">${bodyHtml}</div>
        <div class="modal-actions">
          <button class="btn ghost" id="ovCancel">Cancel</button>
          <button class="btn primary" id="ovSave">${saveLabel||'Save'}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('ovClose').onclick = closeSheet;
  document.getElementById('ovCancel').onclick = closeSheet;
  document.getElementById('ovSave').onclick = onSave;
}
function closeSheet(){ document.getElementById('modalRoot').innerHTML=''; }
function openConfirm(title, msg, onConfirm){
  openSheet(title, `<p style="color:var(--text-dim); font-size:14px;">${msg}</p>`, ()=>{ onConfirm(); closeSheet(); }, 'Confirm');
}
function wireChipGroups(ids){
  ids.forEach(id=>{
    document.querySelectorAll('#'+id+' .chip').forEach(c=>{
      c.onclick = ()=>{
        document.querySelectorAll('#'+id+' .chip').forEach(x=>x.classList.remove('selected'));
        c.classList.add('selected');
      };
    });
  });
}

/* ---------------------------------------------------------------
   TIMER VIEW — PANELS
--------------------------------------------------------------- */
document.getElementById('dateBadge').textContent = new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});

let tickTimer = null;
(function startTicking(){
  tickTimer = setInterval(()=>{
    document.querySelectorAll('[data-live]').forEach(el=>{
      const start = Number(el.dataset.live);
      el.textContent = fmtDur(Date.now()-start);
    });
  },500);
})();

function renderPanels(){
  const container = document.getElementById('panelsContainer');
  container.innerHTML = '';
  ['A','B'].forEach(pid=> container.appendChild(renderPanel(pid)));
}

function newCycle(){
  return {
    id: uid('cyc'), start: Date.now(),
    wrapAttempts: [], wrapEnd: null, cycleEnd: null,
    singlePallet: false,
    perfect: false,
    errors: [], activeError: null,
    exceptions: [], activeException: null,
  };
}

function renderPanel(panelId){
  const wrap = document.createElement('div');
  const runtime = state.panels[panelId];
  const cycle = runtime && runtime.activeCycle;
  let stateClass = 'state-idle';
  if(cycle){ stateClass = (cycle.activeError || cycle.activeException) ? 'state-fault' : 'state-cycle'; }
  wrap.className = 'panel ' + stateClass;

  if(!runtime || !runtime.sessionId){
    const wrapperOptions = state.wrappers.map(w=>`<option value="${w.id}">${w.number}</option>`).join('');
    wrap.innerHTML = `
      <div class="panel-head"><span class="label">${panelId==='A'?'Left':'Right'}</span><span class="badge">Idle</span></div>
      ${state.wrappers.length===0 ? '<p class="empty">No wrappers configured. Add one in Setup.</p>' : `
      <div class="field"><label>Wrapper</label><select id="wrapperSelect_${panelId}">${wrapperOptions}</select></div>
      <button class="btn primary block" id="startSessionBtn_${panelId}">Start session</button>
      `}
    `;
    if(state.wrappers.length>0){
      const btn = wrap.querySelector('#startSessionBtn_'+panelId);
      const sel = wrap.querySelector('#wrapperSelect_'+panelId);
      btn.onclick = ()=> openStartSessionModal(panelId, sel.value);
    }
    return wrap;
  }

  const wrapper = getWrapper(runtime.wrapperId);
  const lastCycle = runtime.cycles.length ? runtime.cycles[runtime.cycles.length-1] : null;
  const canStart = !cycle;
  const canStartWrap = !!cycle && !cycle.wrapEnd && !cycle.activeError && !cycle.activeException;
  const canEndWrap = !!cycle && cycle.wrapAttempts.length>0 && !cycle.wrapEnd && !cycle.activeError && !cycle.activeException;
  const canCycleComplete = !!cycle && !cycle.activeError && !cycle.activeException;
  const canLogError = !!cycle && !cycle.activeException;
  const canLogException = !!cycle && !cycle.activeError;

  let body = '';
  if(cycle){
    body += `<div class="timer-sub">Cycle</div><div class="timer-big nums" data-live="${cycle.start}">0:00</div>`;
    if(cycle.wrapAttempts.length){
      const latestStart = currentWrapStart(cycle);
      const fsCount = failedStartCount(cycle);
      const label = `Wrap${fsCount>0?` · ${fsCount} false start${fsCount>1?'s':''}`:''}`;
      if(cycle.wrapEnd){
        // Wrap is done — freeze it. Show a static duration, not a ticking clock.
        body += `<div class="timer-sub" style="margin-top:4px;">${label} · done</div><div class="timer-mid nums">${fmtDur(cycle.wrapEnd-latestStart)}</div>`;
      } else {
        body += `<div class="timer-sub" style="margin-top:4px;">${label}</div><div class="timer-mid nums" data-live="${latestStart}">0:00</div>`;
      }
    }
    if(cycle.activeError){
      body += `<div class="timer-sub" style="margin-top:4px; color:var(--danger);">Error (${cycle.activeError.errorType||'?'})</div><div class="timer-mid nums" style="color:var(--danger);" data-live="${cycle.activeError.start}">0:00</div>`;
    }
    if(cycle.activeException){
      body += `<div class="timer-sub" style="margin-top:4px; color:var(--accent);">Film reload</div><div class="timer-mid nums" style="color:var(--accent);" data-live="${cycle.activeException.start}">0:00</div>`;
    }
  } else {
    body += `<p class="hint">Tap Start the instant the pallets cross the entry light bar.</p>`;
    if(lastCycle){
      body += `<button class="btn small ${lastCycle.perfect?'success':''}" id="markPerfectBtn_${panelId}" style="margin-top:8px; width:100%;">${lastCycle.perfect ? '✓ Marked perfect run' : 'Mark last observation as perfect'}</button>`;
    }
  }

  body += `<div class="btnstack">
    <button class="btn primary" id="startBtn_${panelId}" ${canStart?'':'disabled'}>Start</button>
    <button class="btn primary" id="startWrapBtn_${panelId}" ${canStartWrap?'':'disabled'}>Start Wrap Cycle</button>
    <button class="btn success" id="endWrapBtn_${panelId}" ${canEndWrap?'':'disabled'}>End Wrap Cycle</button>
    <button class="btn danger" id="cycleCompleteBtn_${panelId}" ${canCycleComplete?'':'disabled'}>Cycle Complete</button>
  </div>`;

  if(cycle){
    body += `<div class="quickrow">
      <button class="btn small ${cycle.singlePallet?'single-active':''}" id="singleBtn_${panelId}">1 pallet</button>
      <button class="btn small ${cycle.activeError?'err-active':''}" id="errorBtn_${panelId}" ${canLogError?'':'disabled'}>${cycle.activeError?'Error — Clear':'Wrapper Error'}</button>
      <button class="btn small ${cycle.activeException?'exc-active':''}" id="exceptionBtn_${panelId}" ${canLogException?'':'disabled'}>${cycle.activeException?'Film Reload — Stop':'Exception'}</button>
    </div>`;
    if(cycle.errors.length){
      body += `<div class="hint" style="margin-top:6px;">${cycle.errors.length} error(s) this cycle</div>`;
    }
    if(cycle.exceptions.length){
      body += `<div class="hint" style="margin-top:2px;">${cycle.exceptions.length} exception(s) this cycle</div>`;
    }
    body += `<button class="btn small ghost" id="cancelObsBtn_${panelId}" style="margin-top:8px; width:100%; color:var(--danger); border-color:var(--danger);">Cancel observation</button>`;
  }

  const canSwitchWrapper = !cycle && runtime.cycles.length===0;

  wrap.innerHTML = `
    <div class="panel-head">
      <span class="wname">${wrapper ? wrapper.number : 'Unknown'}</span>
      <span class="badge ${cycle ? 'running' : ''}">${cycle ? 'Running' : 'Ready'}</span>
    </div>
    ${canSwitchWrapper ? `<button class="btn small ghost" id="switchWrapperBtn_${panelId}" style="margin-top:4px;">Switch wrapper</button>` : ''}
    <div style="margin-top:6px;">${body}</div>
    <div class="row between" style="margin-top:10px;">
      <button class="btn small ghost" id="voiceNoteBtn_${panelId}">🎤</button>
      <button class="btn small ghost" id="endSessionBtn_${panelId}">End session</button>
    </div>
  `;

  const q = (sel)=>wrap.querySelector(sel);
  q('#startBtn_'+panelId).onclick = ()=>{
    runtime.activeCycle = newCycle();
    save(); renderPanels();
  };
  if(q('#startWrapBtn_'+panelId)) q('#startWrapBtn_'+panelId).onclick = ()=>{
    runtime.activeCycle.wrapAttempts.push(Date.now());
    save(); renderPanels();
  };
  if(q('#endWrapBtn_'+panelId)) q('#endWrapBtn_'+panelId).onclick = ()=>{
    runtime.activeCycle.wrapEnd = Date.now();
    save(); renderPanels();
  };
  if(q('#cycleCompleteBtn_'+panelId)) q('#cycleCompleteBtn_'+panelId).onclick = ()=>{
    const c = runtime.activeCycle;
    c.cycleEnd = Date.now();
    runtime.cycles.push(c);
    runtime.activeCycle = null;
    save(); renderPanels();
  };
  if(q('#singleBtn_'+panelId)) q('#singleBtn_'+panelId).onclick = ()=>{
    runtime.activeCycle.singlePallet = !runtime.activeCycle.singlePallet;
    save(); renderPanels();
  };
  if(q('#errorBtn_'+panelId)) q('#errorBtn_'+panelId).onclick = ()=>{
    const c = runtime.activeCycle;
    if(c.activeError){
      c.activeError.end = Date.now();
      openResolvedByModal(panelId);
    } else {
      c.activeError = { start: Date.now(), errorType:null, end:null, resolvedBy:null };
      save(); renderPanels();
      openErrorTypeModal(panelId);
    }
  };
  if(q('#exceptionBtn_'+panelId)) q('#exceptionBtn_'+panelId).onclick = ()=>{
    const c = runtime.activeCycle;
    if(c.activeException){
      c.activeException.end = Date.now();
      c.exceptions.push(c.activeException);
      c.activeException = null;
      save(); renderPanels();
      showToast('Film reload logged');
    } else {
      openExceptionTypeModal(panelId);
    }
  };
  if(q('#cancelObsBtn_'+panelId)) q('#cancelObsBtn_'+panelId).onclick = ()=>{
    openConfirm('Cancel this observation?','This discards the current cycle entirely — nothing will be saved for it.', ()=>{
      runtime.activeCycle = null; save(); renderPanels();
    });
  };
  q('#endSessionBtn_'+panelId).onclick = ()=> openEndSessionModal(panelId);
  q('#voiceNoteBtn_'+panelId).onclick = ()=> openVoiceNoteModal(panelId);
  if(q('#switchWrapperBtn_'+panelId)) q('#switchWrapperBtn_'+panelId).onclick = ()=> openSwitchWrapperModal(panelId);
  if(q('#markPerfectBtn_'+panelId)) q('#markPerfectBtn_'+panelId).onclick = ()=>{
    lastCycle.perfect = !lastCycle.perfect;
    save(); renderPanels();
  };

  return wrap;
}

/* ---- Switch wrapper — only allowed before any cycles are logged
   this session, so history never gets attributed to the wrong
   machine. If cycles already exist, use End Session + Start Session
   again instead. ---- */
function openSwitchWrapperModal(panelId){
  const runtime = state.panels[panelId];
  const options = state.wrappers.map(w=>`<option value="${w.id}" ${w.id===runtime.wrapperId?'selected':''}>${w.number}</option>`).join('');
  openSheet('Switch wrapper', `
    <div class="field"><label>Wrapper</label><select id="m_switchWrapper">${options}</select></div>
  `, ()=>{
    runtime.wrapperId = document.getElementById('m_switchWrapper').value;
    save(); renderPanels(); closeSheet();
    showToast('Wrapper switched');
  }, 'Switch');
}

/* ---- Wrapper error: pick the type directly (errors are always
   machine-owned, so no human/machine split anymore) ---- */
function openErrorTypeModal(panelId){
  openSheet('Error type', `
    <div class="field">
      <div class="chip-select" id="m_errType">
        ${ERROR_TYPES.map(t=>`<div class="chip" data-val="${t}">${t}</div>`).join('')}
      </div>
    </div>
  `, ()=>{
    const chip = document.querySelector('#m_errType .chip.selected');
    if(!chip) return showToast('Pick an error type');
    const runtime = state.panels[panelId];
    runtime.activeCycle.activeError.errorType = chip.dataset.val;
    save(); renderPanels(); closeSheet();
  }, 'Save');
  wireChipGroups(['m_errType']);
}
function openResolvedByModal(panelId){
  openSheet('Who resolved it?', `
    <div class="field">
      <div class="chip-select" id="m_resolvedBy">
        <div class="chip" data-val="Operations">Operations</div>
        <div class="chip" data-val="Maintenance">Maintenance</div>
      </div>
    </div>
  `, ()=>{
    const chip = document.querySelector('#m_resolvedBy .chip.selected');
    if(!chip) return showToast('Pick operations or maintenance');
    const runtime = state.panels[panelId];
    const err = runtime.activeCycle.activeError;
    err.resolvedBy = chip.dataset.val;
    runtime.activeCycle.errors.push(err);
    runtime.activeCycle.activeError = null;
    save(); renderPanels(); closeSheet();
  }, 'Save');
  wireChipGroups(['m_resolvedBy']);
}

/* ---- Exception: Film reload starts/stops a timer (tap Exception
   again to stop it); the other two log instantly. ---- */
function openExceptionTypeModal(panelId){
  openSheet('Log exception', `
    <div class="field">
      <div class="chip-select" id="m_excType">
        ${EXCEPTION_TYPES.map(t=>`<div class="chip" data-val="${t}">${t}</div>`).join('')}
      </div>
    </div>
    <p class="hint">Film reload starts a timer — tap Exception again to stop it once film is reloaded. The other two log instantly with no duration.</p>
  `, ()=>{
    const chip = document.querySelector('#m_excType .chip.selected');
    if(!chip) return showToast('Pick an exception type');
    const type = chip.dataset.val;
    const runtime = state.panels[panelId];
    const c = runtime.activeCycle;
    if(type === 'Film reload'){
      c.activeException = { type, start: Date.now(), end: null };
    } else {
      c.exceptions.push({ type, loggedAt: nowIso() });
      showToast(type + ' logged');
    }
    save(); renderPanels(); closeSheet();
  }, 'Log');
  wireChipGroups(['m_excType']);
}

/* ---- Start session — always asks, everything skippable ---- */
function openStartSessionModal(panelId, wrapperId){
  const w = getWrapper(wrapperId);
  openSheet(`Start session — ${w.number}`, `
    <div class="field"><label>Starting pallet count (optional)</label>
      <input type="number" inputmode="numeric" id="m_startCount" placeholder="e.g. 1000"></div>
    <div class="hint" style="margin-bottom:8px;">Settings below are optional — pre-filled from last time. Skip anything you don't need to change.</div>
    ${settingsInputs(w)}
  `, ()=>{
    const startCounter = document.getElementById('m_startCount').value;
    w.settings = readSettingsInputs(w);
    save();
    state.panels[panelId] = {
      sessionId: uid('sess'), wrapperId, startedAt: nowIso(),
      startCounter, settingsSnapshot: JSON.parse(JSON.stringify(w.settings)),
      cycles: [], activeCycle: null, notes: [],
    };
    save(); renderPanels(); closeSheet();
    showToast('Session started');
  }, 'Start');

  if(w.speedClass === 'high'){
    const copyBtn = document.getElementById(`m_copyToBack_${w.id}`);
    if(copyBtn) copyBtn.onclick = ()=>{
      SETTINGS_FIELDS.forEach(([key])=>{
        const frontEl = document.getElementById(`m_set_${w.id}_front_${key}`);
        const backEl = document.getElementById(`m_set_${w.id}_back_${key}`);
        if(frontEl && backEl) backEl.value = frontEl.value;
      });
      showToast('Copied front settings to back');
    };
  }
}

/* High speed = one asset number, two physical positions (front/back)
   with independent settings, but usually identical — hence the copy
   shortcut. Low speed = each number is its own machine, flat settings. */
function settingsInputs(w){
  if(w.speedClass === 'high'){
    const frontInputs = SETTINGS_FIELDS.map(([key,label])=>`
      <div class="field"><label>${label}</label><input type="text" id="m_set_${w.id}_front_${key}" value="${(w.settings.front && w.settings.front[key]) || ''}"></div>
    `).join('');
    const backInputs = SETTINGS_FIELDS.map(([key,label])=>`
      <div class="field"><label>${label}</label><input type="text" id="m_set_${w.id}_back_${key}" value="${(w.settings.back && w.settings.back[key]) || ''}"></div>
    `).join('');
    return `
      <div class="row between" style="margin-bottom:6px;"><h3 style="margin:0;">Front</h3>
        <button type="button" class="btn small ghost" id="m_copyToBack_${w.id}">Copy to Back →</button>
      </div>
      <div class="settings-grid">${frontInputs}</div>
      <hr class="sep">
      <h3 style="margin:0 0 6px;">Back</h3>
      <div class="settings-grid">${backInputs}</div>
    `;
  }
  return `<div class="settings-grid">${SETTINGS_FIELDS.map(([key,label])=>`
    <div class="field"><label>${label}</label><input type="text" id="m_set_${w.id}_${key}" value="${w.settings[key]||''}"></div>
  `).join('')}</div>`;
}
function readSettingsInputs(w){
  if(w.speedClass === 'high'){
    const front = {}, back = {};
    SETTINGS_FIELDS.forEach(([key])=>{
      const frontEl = document.getElementById(`m_set_${w.id}_front_${key}`);
      const backEl = document.getElementById(`m_set_${w.id}_back_${key}`);
      front[key] = frontEl ? frontEl.value : '';
      back[key] = backEl ? backEl.value : '';
    });
    return { front, back };
  }
  const out = {};
  SETTINGS_FIELDS.forEach(([key])=>{
    const el = document.getElementById(`m_set_${w.id}_${key}`);
    out[key] = el ? el.value : '';
  });
  return out;
}

/* ---- End session — always asks, skippable ---- */
function openEndSessionModal(panelId){
  const runtime = state.panels[panelId];
  const w = getWrapper(runtime.wrapperId);
  if(runtime.activeCycle) return showToast('Finish or cancel the active cycle first');
  openSheet('End session', `
    <p class="hint" style="margin-bottom:10px;">${runtime.cycles.length} cycle(s) logged this session.</p>
    <div class="field"><label>Ending pallet count (optional)</label>
      <input type="number" inputmode="numeric" id="m_endCount" placeholder="e.g. 1042"></div>
  `, ()=>{
    const endCounter = document.getElementById('m_endCount').value;
    state.sessions.push({
      id: runtime.sessionId, wrapperId: runtime.wrapperId,
      startedAt: runtime.startedAt, endedAt: nowIso(),
      startCounter: runtime.startCounter, endCounter,
      settingsSnapshot: runtime.settingsSnapshot,
      cycles: runtime.cycles, notes: runtime.notes,
    });
    state.panels[panelId] = null;
    save(); renderPanels(); closeSheet();
    showToast('Session saved');
  }, 'End session');
}

/* ---- Voice note ---- */
function openVoiceNoteModal(panelId){
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  openSheet('Add note', `
    <div class="field">
      <div class="row" style="gap:10px;">
        <button class="mic-btn" id="m_micBtn">🎤</button>
        <span class="hint" id="m_micStatus">${SpeechRec ? 'Tap mic to dictate, or just type' : 'Voice dictation not supported — type your note'}</span>
      </div>
    </div>
    <div class="field"><textarea id="m_noteText" placeholder="e.g. Mechanical fault, kept shutting off"></textarea></div>
  `, ()=>{
    const text = document.getElementById('m_noteText').value.trim();
    if(!text) return closeSheet();
    const runtime = state.panels[panelId];
    if(runtime) runtime.notes.push({ time: nowIso(), text });
    save(); closeSheet(); showToast('Note saved');
  });

  if(SpeechRec){
    const rec = new SpeechRec();
    rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
    let recording = false, baseText = '';
    const micBtn = document.getElementById('m_micBtn');
    const status = document.getElementById('m_micStatus');
    const textarea = document.getElementById('m_noteText');
    rec.onresult = (e)=>{
      let interim = '', final = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) final += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      textarea.value = (baseText + ' ' + final + ' ' + interim).trim();
      if(final) baseText = (baseText + ' ' + final).trim();
    };
    rec.onerror = ()=>{ recording=false; micBtn.classList.remove('recording'); status.textContent='Mic error — type instead'; };
    rec.onend = ()=>{ if(recording){ rec.start(); } };
    micBtn.onclick = ()=>{
      recording = !recording;
      micBtn.classList.toggle('recording', recording);
      if(recording){ baseText = textarea.value; status.textContent='Listening…'; try{rec.start();}catch(e){} }
      else{ status.textContent='Stopped'; try{rec.stop();}catch(e){} }
    };
  }
}

/* ---------------------------------------------------------------
   HISTORY / EXPORT
--------------------------------------------------------------- */
function renderHistory(){
  const list = document.getElementById('sessionsList');
  const empty = document.getElementById('sessionsEmpty');
  list.innerHTML = '';
  if(state.sessions.length===0){ empty.style.display='block'; return; }
  empty.style.display='none';
  [...state.sessions].reverse().forEach(s=>{
    const w = getWrapper(s.wrapperId);
    const div = document.createElement('div');
    div.className='list-item';
    div.innerHTML = `<span>${w? w.number:'Unknown wrapper'}<small>${fmtDateTime(s.startedAt)} → ${fmtDateTime(s.endedAt)} · ${s.cycles.length} cycles</small></span>`;
    list.appendChild(div);
  });
}

const CYCLE_FIELD_COUNT = 13; // matches cycleFields array below
const ERROR_FIELD_COUNT = 5;  // matches error row fields below

function buildCsv(){
  const headers = [
    'session_id','session_started_at','session_ended_at','wrapper','speed_class',
    'start_pallet_count','end_pallet_count','settings_snapshot',
    'cycle_id','cycle_start','cycle_end','cycle_duration_sec',
    'single_pallet','wrap_attempts_count','failed_starts_count','failed_starts_total_sec',
    'wrap_start','wrap_end','wrap_duration_sec','exceptions_json','perfect_run',
    'error_type','error_resolved_by','error_start','error_end','error_duration_sec',
    'session_notes'
  ];
  const rows = [headers];

  state.sessions.forEach(s=>{
    const w = getWrapper(s.wrapperId);
    const sessionNotes = (s.notes||[]).map(n=>`[${n.time}] ${n.text}`).join(' // ');
    const baseRow = [
      s.id, s.startedAt, s.endedAt, w?w.number:'', w?w.speedClass:'',
      s.startCounter??'', s.endCounter??'', JSON.stringify(s.settingsSnapshot||{}),
    ];

    if(s.cycles.length===0){
      rows.push([...baseRow, ...Array(CYCLE_FIELD_COUNT).fill(''), ...Array(ERROR_FIELD_COUNT).fill(''), sessionNotes]);
      return;
    }

    s.cycles.forEach(c=>{
      const wrapStart = c.wrapAttempts && c.wrapAttempts.length ? c.wrapAttempts[0] : null;
      const cycleDurSec = c.cycleEnd ? Math.round((c.cycleEnd-c.start)/1000) : '';
      const wrapDurSec = (wrapStart && c.wrapEnd) ? Math.round((c.wrapEnd-wrapStart)/1000) : '';
      const cycleFields = [
        c.id, new Date(c.start).toISOString(), c.cycleEnd? new Date(c.cycleEnd).toISOString():'', cycleDurSec,
        c.singlePallet?'yes':'no',
        (c.wrapAttempts?c.wrapAttempts.length:0), failedStartCount(c), Math.round(failedStartsTotalMs(c)/1000),
        wrapStart? new Date(wrapStart).toISOString():'', c.wrapEnd? new Date(c.wrapEnd).toISOString():'', wrapDurSec,
        JSON.stringify(c.exceptions||[]), c.perfect?'yes':'no',
      ];
      const errors = c.errors||[];
      if(errors.length===0){
        rows.push([...baseRow, ...cycleFields, ...Array(ERROR_FIELD_COUNT).fill(''), sessionNotes]);
      } else {
        errors.forEach(e=>{
          const errDurSec = e.end ? Math.round((e.end-e.start)/1000) : '';
          rows.push([...baseRow, ...cycleFields,
            e.errorType||'', e.resolvedBy||'',
            new Date(e.start).toISOString(), e.end? new Date(e.end).toISOString():'', errDurSec,
            sessionNotes
          ]);
        });
      }
    });
  });

  return rows.map(r=>r.map(csvEscape).join(',')).join('\n');
}
function csvEscape(v){
  if(v===null||v===undefined) return '';
  const s = String(v);
  if(/[",\n]/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}

let lastCsvBlob = null;
document.getElementById('exportCsvBtn').onclick = ()=>{
  if(state.sessions.length===0) return showToast('No sessions to export yet');
  const csv = buildCsv();
  lastCsvBlob = new Blob([csv], {type:'text/csv'});
  const filename = `wrap-throughput-${new Date().toISOString().slice(0,10)}.csv`;
  const url = URL.createObjectURL(lastCsvBlob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('CSV downloaded');
  const shareBtn = document.getElementById('shareCsvBtn');
  if(navigator.canShare && navigator.canShare({files:[new File([lastCsvBlob], filename, {type:'text/csv'})]})){
    shareBtn.style.display='block';
    shareBtn.onclick = async ()=>{
      try{ await navigator.share({ files:[new File([lastCsvBlob], filename, {type:'text/csv'})], title:'Wrap throughput data' }); }
      catch(e){ /* cancelled */ }
    };
  }
};

   INIT
--------------------------------------------------------------- */
function renderAll(){ renderPanels(); renderSetup(); renderHistory(); }
renderAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
